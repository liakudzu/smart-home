[workspace]
resolver = "2"
members = [
    "smart_socket_ffi",
    "static_app",
    "dynamic_app",
]

[[bin]]
name = "smart_home"
path = "src/main.rs"

[[bin]]
name = "socket_emulator"
path = "src/bin/socket_emulator.rs"

[[bin]]
name = "thermometer_emulator"
path = "src/bin/thermometer_emulator.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[package]
name = "smart_home"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
rand = "0.10"
crossbeam = "0.8"

# Асинхронная runtime для эмуляторов (net)
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "io-util", "sync"] }

# Примеры не требуют дополнительных зависимостей